[package]
name = "mqtt"
version = "0.1.6"
edition = "2021"
description = "Publishes calls, unit activity and system status to an MQTT broker."
license = "GPL-3.0-or-later"
repository = "https://github.com/TrunkRecorder/trunk-plugin-mqtt"
authors = ["Taclane"]
publish = false

[dependencies]
# The SDK as Trunk Recorder Pro v0.1.11 has it: newer than crates.io's 0.3.0
# (the cipher on call start and end). Back to crates.io once it's published there.
trunk-recorder-plugin = { git = "https://github.com/TrunkRecorder/trunk-recorder-pro", tag = "v0.1.11" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider", "websocket"] }
# ring rather than aws-lc: no cmake or NASM for the release builds.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[profile.release]
strip = true
lto = true
